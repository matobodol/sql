[package]
name = "sql"
edition = "2024"
version = "0.1.0"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rmp-serde = "1.3"
bincode = "1.3"
regex = "1"
ordered-float = { version = "4.2", features = ["serde"] }
thiserror = "1.0"
tempfile = "3.8"

parking_lot = "0.12"
